<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>DT Homebrew Client</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
  </head>
  <body>
    <header>
      <br>
      <h1>THROW THOSE DICE MEANS THRONE THEM DICE</h1>
      <hr>
      <marquee scrollamount=15><p>I hope the Wii Fit Trainer gets stung by a beehive!</p></marquee>
      <hr>
      <br>
    </header>
    <main>
      <div id="entergameview">
        <p><img height="200" id="pit-big-gif" src="./assets/pit-big.gif" alt="Server working"></p>
        <p>Waiting for user input...</p>
        <br>
        <table id="creategametable">
          <tr>
            <td class="labeltext">Server</td>
            <td><input type="url" size="30" placeholder="ws://localhost:8765" required /></td>
          </tr>
          <tr>
            <td class="labeltext">Game Name</td>
            <td><input type="text" size="30" required /></td>
          </tr>
          <tr>
            <td class="labeltext">Password</td>
            <td><input type="text" size="30" required /></td>
          </tr>
        </table>
        <pre><input type="button" value="Host" size="40" />  <input type="button" value="Join" size="40" /></pre>
      </div>

      <div id="gameview" hidden>
        <canvas id="tabletop" width="1280" height="800">
          <img src="./assets/pit-big.gif" alt="The tabletop failed to load :(">
        </canvas>
        <div id="input-container">
          <input type="button"/>
        </div>
      </div>

    </main>
    <footer></footer>
    <script src="index.js" type="module"></script>
  </body>
</html>
